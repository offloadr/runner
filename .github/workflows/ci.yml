name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Desktop app version, for example 1.2.3
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Empty outside releases; the publish script then uses its development version.
  OFFLOADR_RUNNER_VERSION: ${{ inputs.version }}

jobs:
  registry-scripts:
    name: Registry recovery scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash -n build/record-image-channels.sh build/restore-image-channels.sh
      - run: python3 build/test-record-image-channels.py
      - run: python3 build/test-restore-image-channels.py

  test:
    name: Build and test (Linux)
    runs-on: ubuntu-latest
    # Root is required: session isolation tests create and remove Linux users.
    container: mcr.microsoft.com/dotnet/sdk:10.0
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      RUNNER_NATIVE_TESTS_REQUIRED: "1"
    steps:
      - name: Install native prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git gcc libc6-dev aria2
          gcc --version
          aria2c --version

      - uses: actions/checkout@v7

      - name: Build
        run: dotnet build runner.slnx -warnaserror

      - name: Check formatting
        run: dotnet format runner.slnx --verify-no-changes --no-restore

      - name: Unit and native tests
        run: dotnet test runner.slnx --no-build --filter "TestCategory!=RealAria2"

      # Real aria2 transfers run one at a time with a hang guard.
      - name: Real aria2 deterministic transfer
        run: >-
          dotnet test tests/Offloadr.Runner.Tests --no-build
          --filter "FullyQualifiedName=Offloadr.Runner.Tests.Aria2ModelTransferBackendLinuxTests.RealAria2_PausedDeterministicTransfer_WithMetalink_ReplacesUriAndCompletes"
          --blame-hang --blame-hang-timeout 90s
          -- RunConfiguration.TreatNoTestsAsError=true

      - name: Real aria2 native shim
        run: >-
          dotnet test tests/Offloadr.Runner.Tests --no-build
          --filter "FullyQualifiedName=Offloadr.Runner.Tests.Aria2ModelTransferBackendLinuxTests.RealAria2_NativeShim_PausedOpenGatesPiecesAndMmapWaitsForCompletion"
          --blame-hang --blame-hang-timeout 90s
          -- RunConfiguration.TreatNoTestsAsError=true

      - name: Real aria2 restart reattachment
        run: >-
          dotnet test tests/Offloadr.Runner.Tests --no-build
          --filter "FullyQualifiedName=Offloadr.Runner.Tests.Aria2ModelTransferBackendLinuxTests.RealAria2_PartialTransfer_ReattachesAcrossProcessRestartWithoutEpochChange"
          --blame-hang --blame-hang-timeout 90s
          -- RunConfiguration.TreatNoTestsAsError=true

      - name: Real aria2 preemption
        run: >-
          dotnet test tests/Offloadr.Runner.Tests --no-build
          --filter "FullyQualifiedName=Offloadr.Runner.Tests.Aria2ModelTransferBackendLinuxTests.RealAria2_BlockedRangePreemptsStickyTransferAndOnlyOneIsActive"
          --blame-hang --blame-hang-timeout 90s
          -- RunConfiguration.TreatNoTestsAsError=true

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build runner.slnx -warnaserror

      # The agent suite assumes Linux; the supervisor runs on desktops and is tested here too.
      - name: Supervisor tests
        run: dotnet test tests/Offloadr.Runner.Supervisor.Tests --no-build

  desktop:
    name: Desktop app (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet workload install maui-windows --skip-manifest-update

      - name: Publish self-contained folder
        shell: pwsh
        run: ./build/publish-windows.ps1 -Unpackaged

      - uses: actions/upload-artifact@v7
        with:
          name: offloadr-runner-windows-x64
          path: artifacts/packages/windows-win-x64/
          if-no-files-found: error

  contracts:
    name: Lint contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: buf lint
        run: npx --yes @bufbuild/buf@1.73.0 lint contracts

  image:
    name: Image ${{ matrix.target }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [comfyui-latest, comfyui-master, forge-neo-neo, forge-neo-latest]
    env:
      SOURCE_REVISION: ${{ github.sha }}
    steps:
      # The editor base images are around 12 GB; keep BuildKit state on the larger /mnt disk.
      - name: Put BuildKit state on /mnt
        run: |
          sudo mkdir -p /mnt/buildkit-state
          sudo docker volume create \
            --driver local \
            --opt type=none \
            --opt device=/mnt/buildkit-state \
            --opt o=bind \
            buildx_buildkit_ci0_state

      - uses: docker/setup-buildx-action@v4
        with:
          name: ci

      - name: Build ${{ matrix.target }}
        uses: docker/bake-action@v7
        with:
          targets: ${{ matrix.target }}
          push: false
