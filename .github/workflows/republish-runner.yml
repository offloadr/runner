name: Republish runner images to GHCR

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Base source image tag; non-latest tags append -<tag>
        required: true
        type: string
permissions:
  contents: read
  packages: write

concurrency:
  group: republish-runner-ghcr
  cancel-in-progress: false

jobs:
  republish:
    name: ${{ matrix.target }}:${{ matrix.target_tag }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: comfyui
            target_tag: latest
            source_image_repo: oci.offloadr.app/runner/nvidia
            dest_repo: ghcr.io/offloadr/runner-comfyui
          - target: comfyui
            target_tag: master
            source_image_repo: oci.offloadr.app/runner/nvidia
            dest_repo: ghcr.io/offloadr/runner-comfyui
          - target: forge-neo
            target_tag: latest
            source_image_repo: oci.offloadr.app/runner/forge-neo-nvidia
            dest_repo: ghcr.io/offloadr/runner-forge-neo
          - target: forge-neo
            target_tag: neo
            source_image_repo: oci.offloadr.app/runner/forge-neo-nvidia
            dest_repo: ghcr.io/offloadr/runner-forge-neo

    steps:
      - name: Resolve image
        id: resolve_image
        env:
          DISPATCH_SOURCE_TAG: ${{ inputs.source_tag }}
          MATRIX_TARGET_TAG: ${{ matrix.target_tag }}
          MATRIX_SOURCE_IMAGE_REPO: ${{ matrix.source_image_repo }}
          MATRIX_DEST_REPO: ${{ matrix.dest_repo }}
        run: |
          set -eu

          source_tag="${DISPATCH_SOURCE_TAG:-}"

          if [ -z "${source_tag}" ]; then
            echo "source_tag is required" >&2
            exit 1
          fi

          if [ "${MATRIX_TARGET_TAG}" = "latest" ]; then
            resolved_source_tag="${source_tag}"
          else
            resolved_source_tag="${source_tag}-${MATRIX_TARGET_TAG}"
          fi

          source_image="${MATRIX_SOURCE_IMAGE_REPO}:${resolved_source_tag}"
          dest_image="${MATRIX_DEST_REPO}:${MATRIX_TARGET_TAG}"

          echo "source_image=${source_image}" >> "${GITHUB_OUTPUT}"
          echo "dest_image=${dest_image}" >> "${GITHUB_OUTPUT}"
          echo "Will mirror ${source_image} -> ${dest_image}"

      - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            skopeo login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Copy image from source registry to GHCR
        run: |
          set -eu

          source_image="${{ steps.resolve_image.outputs.source_image }}"
          dest_image="${{ steps.resolve_image.outputs.dest_image }}"

          echo "Copying ${source_image} -> ${dest_image}"
          skopeo copy --all \
            "docker://${source_image}" \
            "docker://${dest_image}"

      - name: Verify copied digest
        run: |
          set -eu

          source_image="${{ steps.resolve_image.outputs.source_image }}"
          dest_image="${{ steps.resolve_image.outputs.dest_image }}"

          src_digest="$(skopeo inspect --format '{{.Digest}}' "docker://${source_image}")"
          dest_digest="$(skopeo inspect --format '{{.Digest}}' "docker://${dest_image}")"

          echo "Source image: ${source_image}"
          echo "Destination image: ${dest_image}"
          echo "Source digest: ${src_digest}"
          echo "Destination digest: ${dest_digest}"

          if [ "${src_digest}" != "${dest_digest}" ]; then
            echo "Mirrored digest does not match source digest" >&2
            exit 1
          fi
