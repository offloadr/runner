name: Publish runner images
run-name: Publish ${{ inputs.targets || 'all runner images' }}

# Builds the runner images from this repository and pushes them to ghcr.io/offloadr. These are
# the images personal and hosted runners run.
#
# A run builds the targets it is given, or all of them. An automated dispatch requests the
# targets whose editor image has moved; the run name tells it which targets a queued or running
# publication covers. Each image is built on its editor image's current digest
# and records it in the org.opencontainers.image.base.* labels.
#
# Each pushed digest is signed keylessly with cosign and gets a GitHub build provenance
# attestation, both bound to this workflow and commit; docs/image-publishing.md shows how to
# check them.
#
# A run counts as a release only when the verify step passes: a green build step is not proof
# that the registry holds the image this commit produced, signed and attested.

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Comma-separated targets to publish; empty publishes all"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-runner-images
  cancel-in-progress: false
  queue: max

jobs:
  plan:
    name: Choose targets
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: Choose targets
        id: targets
        env:
          REQUESTED: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          all='["comfyui-latest","comfyui-master","forge-neo-neo","forge-neo-latest"]'
          targets="$(jq -cn --arg requested "$REQUESTED" --argjson all "$all" '
            [$requested | split(",")[] | gsub("^\\s+|\\s+$"; "") | select(. != "")] | unique
            | if length == 0 then $all else . end')"
          unknown="$(jq -rn --argjson targets "$targets" --argjson all "$all" '$targets - $all | join(", ")')"
          if [ -n "$unknown" ]; then
            echo "::error::Unknown targets: $unknown"
            exit 1
          fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  record-channels:
    name: Record previous channel digests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install registry tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo jq
      - name: Record all channels before publication
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$REGISTRY_TOKEN" | skopeo login ghcr.io --username "$REGISTRY_USER" --password-stdin
          ./build/record-image-channels.sh previous-runner-channels.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: previous-runner-channels
          path: previous-runner-channels.json
          if-no-files-found: error

  publish:
    name: Publish ${{ matrix.target }}
    needs: [plan, record-channels]
    runs-on: ubuntu-latest
    # id-token lets the job sign keylessly with its own workflow identity; attestations and
    # artifact-metadata record the build provenance with GitHub.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    env:
      SOURCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The editor base images are around 12 GB; keep BuildKit state on the larger /mnt disk.
      - name: Put BuildKit state on /mnt
        run: |
          sudo mkdir -p /mnt/buildkit-state
          sudo docker volume create \
            --driver local \
            --opt type=none \
            --opt device=/mnt/buildkit-state \
            --opt o=bind \
            buildx_buildkit_ci0_state

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          name: ci

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build on the editor image's current digest, so the image records exactly what it was
      # built from and a later dispatch can tell when that has moved.
      - name: Pin the editor image
        id: base
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          ref="$(docker buildx bake --print "$TARGET" | jq -r --arg target "$TARGET" '.target[$target].args.FINAL_BASE_IMAGE')"
          digest="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "Editor image $ref at $digest"
          printf 'ref=%s\ndigest=%s\n' "$ref" "$digest" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.target }}
        id: bake
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          # The checkout, which is exactly github.sha: by default Bake builds from the event's Git
          # ref, which may have moved on while this run waited, yet the tags and the verify step
          # would still name github.sha.
          source: .
          targets: ${{ matrix.target }}
          push: true
          # The registry cache keeps the agent build, and everything above the editor image while
          # it is unchanged, across runs on fresh machines.
          set: |
            ${{ matrix.target }}.args.FINAL_BASE_IMAGE=${{ steps.base.outputs.ref }}@${{ steps.base.outputs.digest }}
            ${{ matrix.target }}.args.BASE_IMAGE_NAME=${{ steps.base.outputs.ref }}
            ${{ matrix.target }}.args.BASE_IMAGE_DIGEST=${{ steps.base.outputs.digest }}
            ${{ matrix.target }}.cache-from=type=registry,ref=ghcr.io/offloadr/runner-build-cache:${{ matrix.target }}
            ${{ matrix.target }}.cache-to=type=registry,ref=ghcr.io/offloadr/runner-build-cache:${{ matrix.target }},mode=max

      - name: Read what the build pushed
        id: pushed
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          digest="$(jq -r --arg target "$TARGET" '.[$target]["containerimage.digest"] // empty' <<< "$METADATA")"
          names="$(jq -r --arg target "$TARGET" '.[$target]["image.name"] // empty' <<< "$METADATA")"
          if [ -z "$names" ]; then
            echo "::error::The build reported no pushed tags for $TARGET."
            exit 1
          fi
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The build reported no image digest for $TARGET ('$digest')."
            exit 1
          fi

          # Every tag of a target names the same repository; signatures and provenance belong to
          # the digest in it, so they hold for each tag and survive a channel being moved back.
          repositories="$(tr ',' '\n' <<< "$names" | sed 's/:[^:/]*$//' | sort -u)"
          if [ "$(wc -l <<< "$repositories")" -ne 1 ]; then
            echo "::error::The tags of $TARGET name more than one repository: $names"
            exit 1
          fi
          printf 'digest=%s\nrepository=%s\nnames=%s\n' "$digest" "$repositories" "$names" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Keyless: the certificate names this workflow, its ref and the commit, and the signature
      # is logged in the public Rekor transparency log. No key exists to leak or rotate.
      - name: Sign the image
        env:
          IMAGE: ${{ steps.pushed.outputs.repository }}@${{ steps.pushed.outputs.digest }}
        run: cosign sign --yes "$IMAGE"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.pushed.outputs.repository }}
          subject-digest: ${{ steps.pushed.outputs.digest }}
          push-to-registry: true

      - name: Verify the registry holds this build
        env:
          DIGEST: ${{ steps.pushed.outputs.digest }}
          NAMES: ${{ steps.pushed.outputs.names }}
          TARGET: ${{ matrix.target }}
          EXPECTED_BASE_NAME: ${{ steps.base.outputs.ref }}
          EXPECTED_BASE_DIGEST: ${{ steps.base.outputs.digest }}
          EXPECTED_SIGNER_WORKFLOW: ${{ github.workflow_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo jq
          echo "$REGISTRY_TOKEN" | skopeo login ghcr.io --username "$REGISTRY_USER" --password-stdin

          IFS=',' read -r -a refs <<< "$NAMES"
          ./build/verify-published-image.sh "$DIGEST" "$SOURCE_REVISION" "${refs[@]}"

          {
            echo "### $TARGET"
            echo
            echo "Revision \`$SOURCE_REVISION\`, digest \`$DIGEST\`, signed and attested:"
            for ref in "${refs[@]}"; do echo "- \`$ref\`"; done
          } >> "$GITHUB_STEP_SUMMARY"
