name: Publish runner images

# Builds the runner images from this repository and pushes them to ghcr.io/offloadr. These are
# the images personal and hosted runners run.
#
# Manual for now. Before the first run, retire the mirror: delete republish-runner.yml here and
# stop the control plane's CI from dispatching it, otherwise the mirror overwrites these tags.
# The editor image repositories can trigger a rebuild after publishing a new editor release with
# a repository_dispatch of type editor-image-updated.

on:
  workflow_dispatch:
  repository_dispatch:
    types: [editor-image-updated]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-runner-images
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [comfyui-latest, comfyui-master, forge-neo-neo, forge-neo-latest]
    env:
      SOURCE_REVISION: ${{ github.sha }}
    steps:
      # The editor base images are around 12 GB; keep BuildKit state on the larger /mnt disk.
      - name: Put BuildKit state on /mnt
        run: |
          sudo mkdir -p /mnt/buildkit-state
          sudo docker volume create \
            --driver local \
            --opt type=none \
            --opt device=/mnt/buildkit-state \
            --opt o=bind \
            buildx_buildkit_ci0_state

      - uses: docker/setup-buildx-action@v4
        with:
          name: ci

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.target }}
        uses: docker/bake-action@v7
        with:
          targets: ${{ matrix.target }}
          push: true
