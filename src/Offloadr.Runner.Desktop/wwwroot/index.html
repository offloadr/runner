<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Offloadr Runner</title>
  <base href="/" />
  <link rel="icon" type="image/svg+xml" href="_content/Offloadr.Runner.UI/icon.svg" />
  <!-- Painted before any stylesheet loads, in the colors of the app's page, so nothing flashes white. -->
  <style>
    html, body { margin: 0; background: #f4f7fb; color: #102033; font-family: "Avenir Next", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) { html, body { background: #07111f; color: #edf4ff; } }
    #app:empty, .runner-opening { padding: 32px; }
  </style>
  <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
  <link href="_content/Offloadr.Runner.UI/tokens.css" rel="stylesheet" />
  <link href="_content/Offloadr.Runner.UI/runner.css" rel="stylesheet" />
</head>
<body>
  <div id="app"><div class="runner-opening">Opening Offloadr Runner…</div></div>
  <div id="blazor-error-ui" style="display: none">Something went wrong. Restart Offloadr Runner; your runner keeps running until you quit.</div>
  <script src="_content/MudBlazor/MudBlazor.min.js"></script>
  <script src="_framework/blazor.webview.js" autostart="false"></script>
</body>
</html>
