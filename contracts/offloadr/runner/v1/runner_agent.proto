syntax = "proto3";

package offloadr.runner.v1;

import "offloadr/common/v1/gpus.proto"; // GpuType
import "offloadr/common/v1/models.proto"; // ModelCategory
import "offloadr/common/v1/gpu_control.proto";
import "offloadr/editor_runtime/v1/editor_proxy.proto"; // Artifact messages
import "google/protobuf/timestamp.proto"; // Timestamp for session stream events
import "google/protobuf/wrappers.proto";

// The wire contract this file describes. Every coordinated runner and control-plane
// release that changes it raises CURRENT; the control plane refuses any other version,
// so an outdated runner is told to update instead of misbehaving.
enum RunnerProtocol {
    RUNNER_PROTOCOL_UNSPECIFIED = 0;
    RUNNER_PROTOCOL_CURRENT = 7;
}

message RunnerRuntimeTelemetrySnapshot {
  google.protobuf.UInt32Value utilization_percent = 1;
  google.protobuf.UInt64Value vram_used_bytes = 2;
  google.protobuf.UInt64Value vram_total_bytes = 3;
  google.protobuf.UInt32Value temperature_celsius = 4;
  google.protobuf.Timestamp sampled_utc = 5;
  google.protobuf.UInt32Value fan_percent = 6;
  google.protobuf.DoubleValue power_usage_watts = 7;
  google.protobuf.DoubleValue power_limit_watts = 8;
  google.protobuf.DoubleValue power_min_limit_watts = 9;
  google.protobuf.DoubleValue power_default_limit_watts = 10;
  google.protobuf.DoubleValue power_max_limit_watts = 11;
  google.protobuf.UInt64Value system_ram_used_bytes = 12;
  google.protobuf.UInt64Value system_ram_total_bytes = 13;
  google.protobuf.UInt64Value model_disk_available_bytes = 14;
  google.protobuf.UInt64Value model_disk_total_bytes = 15;
  string model_disk_path = 16;
}

// Basic hardware/resource snapshot sent during registration.
message RunnerResources {
	offloadr.common.v1.GpuType gpu_type = 1;       // Optional coarse classification for hosted matching/metrics.
	uint64 gpu_count = 2;       // Number of GPUs visible/usable.
	uint64 vram_bytes = 3;      // Total VRAM across all GPUs (or primary) in bytes.
	uint64 system_ram_bytes = 4;// Total system RAM in bytes.
    string gpu_model_name = 5;  // Free-form GPU model (e.g., "NVIDIA GeForce RTX 4090").
}

// Sealed sessions keep user data in memory-backed storage on the runner and seal artifact
// transfers with the envelope format in docs/sealed-envelope.md.
enum SealedStorageMode {
    SEALED_STORAGE_MODE_UNSPECIFIED = 0;
    SEALED_STORAGE_MODE_OFF = 1;      // Never seals; refuses starts that require it.
    SEALED_STORAGE_MODE_AUTO = 2;     // Seals sessions whose start requires it.
    SEALED_STORAGE_MODE_REQUIRED = 3; // Seals every session's workspace.
}

// What a runner can offer sealed sessions, reported with every registration.
message RunnerSealedStorage {
    SealedStorageMode mode = 1;
    bool memory_workspace_available = 2; // The memory-backed root can take a session now.
    uint64 budget_bytes = 3;             // Smaller of the root's free space and the container's memory headroom.
    repeated string algorithms = 4;      // Sealing algorithm ids the runner accepts.
}

// A public key that envelopes are sealed to.
message SealingPublicKey {
    string key_id = 1;    // Chosen by the key's owner; 1 to 128 UTF-8 bytes.
    string algorithm = 2; // "hpke-p256-sha256-aes128gcm+stream-aes256gcm-64k-v1"
    bytes public_key = 3; // 65-byte uncompressed SEC1 P-256 point.
}

// Key material sent ahead of a sealed payload. The stream's chunk messages then carry the
// payload ciphertext, which they may split anywhere.
message SealedEnvelope {
    bytes header = 1;           // Canonical header; names the recipient key and the object.
    bytes encapsulated_key = 2; // HPKE enc (65 bytes).
    bytes sealed_data_key = 3;  // HPKE-sealed data key (48 bytes).
}

// How a session's data is protected.
message SessionSealing {
    // The sealed-session profile: a memory-backed workspace, every upload sealed to
    // output_recipient and every read answered sealed to the runner's reader key. A runner that
    // cannot provide all of it refuses the start; inside the profile it never falls back to
    // plaintext transfers.
    bool required = 1;
    // Recipient for uploads. When set outside the profile, uploads are still sealed to it.
    SealingPublicKey output_recipient = 2;
}

// What the runner applied to a started session.
message SessionSealingStatus {
    bool memory_workspace = 1;         // The session's user data lives in memory-backed storage.
    bool encrypted_uploads = 2;        // Every upload is sealed to the output recipient.
    bool encrypted_reads_required = 3; // A read answered without an envelope fails.
}

// One launch of a session's editor runtime. The control plane mints a new runtime_id for every
// StartRuntimeCommand and takes its runtime_order from one sequence shared by every session and
// runner, so any two orders compare: higher is newer. Everything the runner sends about a runtime
// names it with this, and the control plane accepts it only for the runtime that serves the
// session or the one whose start is pending.
message RuntimeRef {
    string runtime_id = 1;    // UUID, no dashes.
    uint64 runtime_order = 2;
}

// Starts a session's editor runtime: the session's first runtime and every relaunch of it.
// The runner refuses a start whose order is not above the session's Stop cutoff, or is below the
// newest start it adopted (any session), so a delayed start cannot replace newer work. A start
// for the runtime it already adopted joins that startup or sends its recorded acknowledgement
// again. A newer start for the same session stops the session's current child first; one for
// another session pre-empts that session.
message StartRuntimeCommand {
    reserved 10, 11, 12, 13;
    reserved "runtime_epoch", "runtime_instance_id", "assignment_sequence";

    string session_id = 1;     // Session id (uuid, no dashes)
    string user = 2;           // Username/owner for the session
    string editor_sid = 3;
    repeated ModelDownloadRequest initial_models = 4;
    repeated offloadr.editor_runtime.v1.EditorArtifactMetadata initial_artifacts = 5;
    repeated WorkspaceFileMetadata initial_workspace_files = 6;
    string editor_template = 7;
    string editor_runtime_kind = 8;
    // The session's GPU lifecycle generation. Not a runtime identity: it only matches the
    // targets of GPU power commands for the session.
    uint64 lifecycle_generation = 9;
    // Optional. Absent means an unsealed session, unless the runner seals every session. A
    // relaunch carries the session's sealing too and may not weaken it.
    SessionSealing sealing = 14;
    RuntimeRef runtime = 15;
}

// Command instructing runner to stop a session (graceful cleanup + release).
message StopSessionCommand {
    reserved 4, 5, 6;
    reserved "lifecycle_generation", "runtime_epoch", "runtime_instance_id";

	string session_id = 1;
	string user = 2;
	string command_id = 3;
	// The Stop's cutoff, taken from the same sequence as RuntimeRef.runtime_order. The Stop
	// covers the session's runtimes up to this order; if the runner holds a runtime, a child or
	// a startup of the session with a higher order, the Stop is acknowledged as superseded and
	// does nothing. The runner keeps the cutoff and refuses any start of the session at or
	// below it.
	uint64 up_to_runtime_order = 7;
}

// One HTTP request to the editor runtime, as the browser sent it.
message PromptRequest {
    string method = 1;
    string path = 2;
    string query = 3;
    string body = 4;
    string content_type = 5;
}

// A placeholder in the request body that names an input file prepared on the platform.
message PromptArtifact {
    string placeholder = 1;
    string filename = 2;
    string type = 3;
    string subfolder = 4;
}

// A generation or editor request handed to the runner. The handoff exists on the platform
// until expires_utc; the runner runs it at most once, and only after GrantPromptExecution
// answers GRANTED. Redelivery of the same handoff_id is normal until then.
message SubmitPromptCommand {
    reserved 6, 7, 8;
    reserved "lifecycle_generation", "runtime_epoch", "runtime_instance_id";

    string handoff_id = 1;
    string session_id = 2;
    string editor_sid = 3;
    string owner = 4;
    string editor_runtime_kind = 5;
    // The runtime the handoff was accepted for; the runner refuses it for any other.
    RuntimeRef runtime = 16;
    PromptRequest request = 9;
    // Editor state requests replayed, in order, before the request itself.
    repeated PromptRequest preflight_requests = 10;
    repeated PromptArtifact artifact_references = 11;
    repeated ModelDownloadRequest downloads = 12;
    // The ComfyUI client the browser identified in the request; empty for other editors.
    string client_id = 13;
    bytes websocket_client_message = 14;
    google.protobuf.Timestamp expires_utc = 15;
}

message RelayEditorRuntimeRequestCommand {
    reserved 6, 18, 19, 20, 21;
    reserved "lifecycle_generation", "runtime_epoch", "runtime_instance_id", "bridge_connection_id", "bridge_lease_revision";

    string request_id = 1;
    string delivery_id = 2;
    string runner_id = 3;
    string session_id = 4;
    string editor_sid = 5;
    offloadr.editor_runtime.v1.EditorRuntimeRequestKind kind = 7;
    string method = 8;
    string path = 9;
    string query = 10;
    bytes body = 11;
    string content_type = 12;
    string client_id = 13;
    bytes client_message = 14;
    google.protobuf.Timestamp expires_utc = 15;
    uint32 attempt = 16; // Delivery attempt of this request, not a runtime identity.
    bool urgent = 17;
    RuntimeRef runtime = 22;
}

message AcknowledgeEditorRuntimeRequestRequest {
    reserved 5, 12, 13;
    reserved "lifecycle_generation", "runtime_epoch", "runtime_instance_id";

    string request_id = 1;
    string delivery_id = 2;
    string runner_id = 3;
    string session_id = 4;
    bool transport_succeeded = 6;
    int32 status_code = 7;
    bytes body = 8;
    string content_type = 9;
    string error_message = 10;
    offloadr.editor_runtime.v1.EditorRuntimeRequestKind kind = 11;
    RuntimeRef runtime = 14;
}

message ModelDownloadRequest {
    string model_id = 1;
    offloadr.common.v1.ModelCategory category = 2;
    string filename = 3;
    string destination_path = 4;
    int64 size_bytes = 5;
    string metalink_xml = 6;
    string source_url = 7;
    string local_selection_hash = 8; // Present when a registered model should be projected from runner-local inventory instead of downloaded.
    string relative_model_path = 9; // Runtime model path relative to the runner session model root.
}

enum ModelDownloadState {
    MODEL_DOWNLOAD_STATE_UNSPECIFIED = 0;
    MODEL_DOWNLOAD_STATE_IN_PROGRESS = 1;
    MODEL_DOWNLOAD_STATE_COMPLETE = 2;
    MODEL_DOWNLOAD_STATE_FAILED = 3;
    MODEL_DOWNLOAD_STATE_RETRYING = 4;
}

message ReportModelDownloadRequest {
    reserved 13, 14, 15;
    reserved "runtime_epoch", "runtime_instance_id", "lifecycle_generation";

    string runner_id = 1;
    string session_id = 2;
    string model_id = 3;
    string filename = 4;
    string destination_path = 5;
    int64 bytes_downloaded = 6;
    int64 total_bytes = 7;
    double percent = 8;
    ModelDownloadState state = 9;
    string message = 10;
    int64 bytes_per_second = 11;
    int64 average_bytes_per_second = 12;
    RuntimeRef runtime = 16;
}

message ReportModelDownloadResponse {}

message SyncLocalModelsRequest {
    string runner_id = 1;
    repeated string selection_hashes = 2;
    string snapshot_digest = 3;
    bool full_snapshot = 4;
}

message SyncLocalModelsResponse {
    int32 accepted_count = 1;
}

enum WorkspaceRoot {
    WORKSPACE_ROOT_UNSPECIFIED = 0;
    WORKSPACE_ROOT_USER = 1;
    WORKSPACE_ROOT_CUSTOM_NODES = 2;
    WORKSPACE_ROOT_INPUT = 3;
}

message WorkspaceFileMetadata {
    WorkspaceRoot root = 1;
    string relative_path = 2;
    int64 size_bytes = 3;
    google.protobuf.Timestamp modified_utc = 4;
}

// Where the runner's editor runtime is. The phase is a report, not a command: the
// start acknowledgement stays the owner of a start's result.
enum RuntimePhase {
    RUNTIME_PHASE_UNSPECIFIED = 0;
    RUNTIME_PHASE_NONE = 1;     // No session, or a session held with no editor process.
    RUNTIME_PHASE_STARTING = 2; // A start of the runtime below is running.
    RUNTIME_PHASE_READY = 3;    // The runtime below finished starting ready.
    RUNTIME_PHASE_FAILED = 4;   // The runtime below failed to start and the runner still holds its session.
                                // A runtime that exits unexpectedly ends the session: NONE.
    RUNTIME_PHASE_STOPPING = 5; // The session is stopping.
}

// The runner's one logical session and the runtime it runs, sent with every registration.
// Reported by a runner that runs sessions only.
message RuntimeStatus {
    reserved 2, 3, 4;
    reserved "lifecycle_generation", "runtime_epoch", "runtime_instance_id";

    string session_id = 1;           // Empty when the runner holds no session.
    RuntimeRef runtime = 8;          // Unset when the phase has no runtime.
    RuntimePhase phase = 5;
    SessionSealingStatus sealing = 6; // What the runtime got; set only when READY.
    string message = 7;               // Why it failed; set only when FAILED, at most 512 bytes.
    // The highest runtime_order this process had settled when it sampled this status, also when
    // session_id is empty; 0 when it has settled none. A Start is settled once the session names
    // its runtime (it was adopted) or its outcome is "not ready" (it was refused, or failed before
    // it was adopted). A Stop settles its cutoff when the cutoff is recorded. The control plane
    // does not act on a report from an executor it has sent a newer Start: that report was
    // sampled before the Start was settled.
    uint64 settled_runtime_order = 9;
}

// What a registration speaks for. One runner (one key, one runner_id) can have an executor and a
// launcher registered at the same time; each keeps its own instance_id and liveness.
enum RunnerRole {
    RUNNER_ROLE_UNSPECIFIED = 0; // Refused.
    RUNNER_ROLE_EXECUTOR = 1;    // The agent in a runner container: runs sessions.
    RUNNER_ROLE_LAUNCHER = 2;    // Starts runner containers on request (LauncherStream); never runs sessions.
}

// Request sent by a runner agent (executor) or a desktop app (launcher) when (re)registering with
// Offloadr API. A launcher's heartbeat means only "can launch these editors": it refreshes no
// executor liveness and protects no session.
message RegisterRunnerRequest {
    reserved 5, 6;
    reserved "active_session_id", "active_session_reported";

	string runner_id = 1;       // Stable unique ID (e.g., UUID) generated client side.
	string version = 2;         // Runner agent semantic version (launcher: the app's version).
	RunnerResources resources = 3; // Current resource snapshot (launcher: the host GPU it launches on).
    string instance_id = 4;    // Process instance id; changes on runner process restart.
    // Executor: the editor templates this image can execute. Launcher: those it can launch.
    repeated string supported_editor_templates = 7;
    RunnerSealedStorage sealed_storage = 8; // What this runner can offer sealed sessions. Executor only.
    uint32 protocol_version = 9; // RunnerProtocol.RUNNER_PROTOCOL_CURRENT of the runner's build.
    RuntimeStatus runtime = 10;  // The session this runner holds and its runtime. Executor only.
    RunnerRole role = 11;
    // Executor only: the LaunchRunnerCommand.launch_id this container was started for; empty when
    // it was started otherwise (by hand, or by hosting). The only way a launch finds its executor.
    // A registration carrying a retired, released or unknown launch_id, or a released instance_id, is
    // refused (EXECUTOR_FENCED) before anything else is touched: it never replaces the current executor
    // instance, refreshes liveness or ends a session. Only a launch no executor has matched can be
    // retired: the first accepted registration echoing it that is eligible for its allocation (for one,
    // it supports the launch's editor_template) matches it; a refused or ineligible one matches
    // nothing. A matched launch is never retired afterwards. An executor echoing the launch_id of the
    // registered one is that container's agent restarted: it replaces it even while busy, and the
    // instance it replaces is fenced in the same transaction.
    string launch_id = 12;
    // Launcher only: increases whenever what it offers changes (the GPU or the container engine it
    // launches on), within one launcher instance. A launch carries the offer_revision of the heartbeat
    // it was allocated against (LaunchRunnerCommand.offer_revision).
    uint64 offer_revision = 13;
}

// Why registration was refused. Anything other than these four is retried.
enum RegistrationRejection {
    REGISTRATION_REJECTION_UNSPECIFIED = 0;
    REGISTRATION_REJECTION_RUNNER_OUTDATED = 1; // The runner speaks an older protocol: update it.
    REGISTRATION_REJECTION_SERVER_OUTDATED = 2; // The runner is newer than this control plane.
    // Launcher only: another launcher instance registered for this runner since (the newest one wins).
    // The superseded launcher stops registering and stays offline until the person starts it again.
    REGISTRATION_REJECTION_LAUNCHER_SUPERSEDED = 3;
    // Executor only: its launch_id was retired or released, or its instance_id released. It can
    // never be accepted, so the agent stops registering and exits.
    REGISTRATION_REJECTION_EXECUTOR_FENCED = 4;
}

// Response acknowledging registration. Fields 1-3 never change, so any past runner
// can read why it was refused.
message RegisterRunnerResponse {
	bool accepted = 1;          // False if rejected.
	string message = 2;         // Human-readable reason / guidance.
	int32 refresh_seconds = 3;  // When to re-register / heartbeat; 0 = default.
	uint32 server_protocol_version = 4; // The control plane's RunnerProtocol.RUNNER_PROTOCOL_CURRENT.
	RegistrationRejection rejection = 5;
}

// The outcome of one StartRuntimeCommand, named by its runtime. A repeated start of the same
// runtime is answered with the same acknowledgement.
message AcknowledgeRuntimeStartRequest {
    reserved 5, 6, 7;
    reserved "lifecycle_generation", "runtime_epoch", "runtime_instance_id";

    string session_id = 1;
    string user = 2;
    bool ready = 3;
    string message = 4;
    SessionSealingStatus sealing = 8; // What the started runtime got; unset when it did not start.
    string instance_id = 9; // Registered process that executed the start.
    RuntimeRef runtime = 10;
}

// Unary ack request message for stop-session.
enum RunnerCleanupDisposition {
    RUNNER_CLEANUP_DISPOSITION_UNSPECIFIED = 0;
    RUNNER_CLEANUP_DISPOSITION_PERFORMED = 1;
    RUNNER_CLEANUP_DISPOSITION_SUPERSEDED = 2;
}

message AcknowledgeSessionStopRequest {
    reserved 5, 6, 7;
    reserved "lifecycle_generation", "runtime_epoch", "runtime_instance_id";

    string session_id = 1;
    string user = 2;
    string command_id = 3;
    // Registered runner process acknowledging the captured command.
    string instance_id = 4;
    // Echo of the Stop command's cutoff.
    uint64 up_to_runtime_order = 11;
    // Artifacts that failed or were still uploading when the session's data was removed. They
    // are lost; the session must not be reported as fully saved when this is not zero.
    uint32 unsaved_artifact_count = 8;
    // True when the runner could not count every artifact it lost (its uploads did not stop in
    // time, or an artifact folder could not be read): unsaved_artifact_count is then only what
    // it could see, and the session must not be reported as fully saved.
    bool unsaved_artifacts_unknown = 9;
    RunnerCleanupDisposition cleanup_disposition = 10;
}

enum PromptResultOutcome {
    PROMPT_RESULT_OUTCOME_UNSPECIFIED = 0;
    // The editor runtime answered; status_code, body and content_type are its response.
    PROMPT_RESULT_OUTCOME_NATIVE_RESPONSE = 1;
    // Nothing reached the editor runtime.
    PROMPT_RESULT_OUTCOME_NOT_EXECUTED = 2;
    // The editor runtime was called, but its answer is not known.
    PROMPT_RESULT_OUTCOME_UNKNOWN = 3;
}

// Sent once per granted handoff, by the runner instance that holds the grant. Resending the
// same result is accepted as already applied; a different result is refused.
message AcknowledgePromptResultRequest {
    string runner_id = 1;
    string session_id = 2;
    string handoff_id = 3;
    string instance_id = 4;
    PromptResultOutcome outcome = 5;
    int32 status_code = 6;
    bytes body = 7;
    string content_type = 8;
    // The editor answered, but the body was larger than the runner relays.
    bool body_omitted = 9;
    string diagnostic_code = 10;
}

message GrantPromptExecutionRequest {
    reserved 5, 6, 7;
    reserved "lifecycle_generation", "runtime_epoch", "runtime_instance_id";

    string runner_id = 1;
    string session_id = 2;
    string handoff_id = 3;
    string instance_id = 4;
    RuntimeRef runtime = 8;
}

enum PromptGrantOutcome {
    PROMPT_GRANT_OUTCOME_UNSPECIFIED = 0;
    // Run it now. A retry from the same instance gets GRANTED again, so a lost reply is safe.
    PROMPT_GRANT_OUTCOME_GRANTED = 1;
    // Another runner instance holds the grant. Do not run it and do not acknowledge it.
    PROMPT_GRANT_OUTCOME_ALREADY_GRANTED = 2;
    // The handoff expired, was retired or never existed. Do not run it.
    PROMPT_GRANT_OUTCOME_MISSING_OR_EXPIRED = 3;
    // The runtime it was accepted for is no longer current. Do not run it.
    PROMPT_GRANT_OUTCOME_TARGET_NOT_CURRENT = 4;
    // The owner's account can no longer start work. Do not run it.
    PROMPT_GRANT_OUTCOME_ACCOUNT_UNAVAILABLE = 5;
}

message GrantPromptExecutionResponse {
    PromptGrantOutcome outcome = 1;
}

message SetGpuPowerLimitCommand {
    string command_id = 1;
    string session_id = 2;
    double target_watts = 3;
    offloadr.common.v1.GpuControlTarget target = 4;
}

message GrantGpuPowerExecutionRequest {
    string command_id = 1;
    string runner_id = 2;
    string session_id = 3;
    offloadr.common.v1.GpuControlTarget target = 4;
}

message GrantGpuPowerExecutionResponse {
    // An exact retry cannot grant another execution after response loss.
    bool may_execute = 1;
}

message AcknowledgeGpuPowerLimitRequest {
    string command_id = 1;
    string runner_id = 2;
    string session_id = 3;
    offloadr.common.v1.GpuPowerOutcome outcome = 4;
    string message = 5;
    double requested_watts = 6;
    double applied_watts = 7;
    offloadr.runner.v1.RunnerRuntimeTelemetrySnapshot telemetry = 8;
    offloadr.common.v1.GpuControlTarget target = 9;
}

enum SessionStreamFrameType {
    SESSION_STREAM_FRAME_TYPE_UNSPECIFIED = 0;
    SESSION_STREAM_FRAME_TYPE_TEXT = 1;
    SESSION_STREAM_FRAME_TYPE_BINARY = 2;
}

message SessionStreamEvent {
    reserved 11, 12, 13;
    reserved "lifecycle_generation", "runtime_epoch", "runtime_instance_id";

    string runner_id = 1;
    string session_id = 2;
    string editor_sid = 3;
    string client_id = 4;
    string handoff_id = 5;
    string prompt_id = 6;
    string event_type = 7;
    SessionStreamFrameType frame_type = 8;
    bytes payload = 9;
    google.protobuf.Timestamp created_utc = 10;
    RuntimeRef runtime = 15;
    // Set only by the runner, never from editor output: the runner's native socket for
    // client_id is open under this runtime. An event with it has no payload.
    BridgeState bridge_state = 14;
}

// Sent when the runner's native editor socket for a client opens, then every 10 seconds
// while it stays open. A new connection_id means a new native connection, whose
// per-client editor state (feature flags, log subscription) must be sent again.
message BridgeState {
    string connection_id = 1; // UUID minted by the runner for each native connection.
}

// A required fact that a managed runtime produced native activity. It carries no
// log, prompt, result, exception text or producer timestamp. Physical readiness
// and optional diagnostic delivery remain independent.
message ReportRuntimeActivityRequest {
    reserved 4, 5, 6;
    reserved "lifecycle_generation", "runtime_epoch", "runtime_instance_id";

    string runner_id = 1;
    string session_id = 2;
    string instance_id = 3;
    SessionSealingStatus sealing = 7;
    RuntimeRef runtime = 8;
}

enum RuntimeActivityOutcome {
    RUNTIME_ACTIVITY_OUTCOME_UNSPECIFIED = 0;
    RUNTIME_ACTIVITY_OUTCOME_APPLIED = 1;
    RUNTIME_ACTIVITY_OUTCOME_ALREADY_APPLIED_EXACTLY = 2;
    RUNTIME_ACTIVITY_OUTCOME_OBSOLETE_OR_PREEMPTED = 3;
    RUNTIME_ACTIVITY_OUTCOME_INVALID_IDENTITY = 4;
    RUNTIME_ACTIVITY_OUTCOME_CONFLICTING_STATE = 5;
    RUNTIME_ACTIVITY_OUTCOME_NOT_READY = 6;
}

message ReportRuntimeActivityResponse {
    RuntimeActivityOutcome outcome = 1;
    google.protobuf.Timestamp runtime_started_utc = 2;
}

message ReportSessionEventsRequest {
    repeated SessionStreamEvent events = 1;
}

message ReportSessionEventsResponse {}

enum SessionProcessLogStream {
    SESSION_PROCESS_LOG_STREAM_UNSPECIFIED = 0;
    SESSION_PROCESS_LOG_STREAM_STDOUT = 1;
    SESSION_PROCESS_LOG_STREAM_STDERR = 2;
}

message SessionProcessLogEntry {
    reserved 7, 8, 9;
    reserved "lifecycle_generation", "runtime_epoch", "runtime_instance_id";

    string runner_id = 1;
    string session_id = 2;
    SessionProcessLogStream stream = 3;
    string message = 4;
    google.protobuf.Timestamp created_utc = 5;
    uint64 sequence = 6;
    RuntimeRef runtime = 10;
}

message ReportSessionLogsRequest {
    repeated SessionProcessLogEntry entries = 1;
}

message ReportSessionLogsResponse {}

message RunnerLogEntry {
    string runner_id = 1;
    string category = 2;
    string message = 3;
    google.protobuf.Timestamp created_utc = 4;
    uint64 sequence = 5;
    // Stable for one relay lifetime, including reconnects/retries; new on restart.
    string relay_instance_id = 6;
}

message ReportRunnerLogsRequest {
    repeated RunnerLogEntry entries = 1;
}

message ReportRunnerLogsResponse {}

message SessionRuntimeTelemetryEntry {
    reserved 4, 5, 6;
    reserved "lifecycle_generation", "runtime_epoch", "runtime_instance_id";

    string runner_id = 1;
    string session_id = 2;
    offloadr.runner.v1.RunnerRuntimeTelemetrySnapshot telemetry = 3;
    RuntimeRef runtime = 7;
}

message ReportRuntimeTelemetryRequest {
    repeated SessionRuntimeTelemetryEntry entries = 1;
}

message ReportRuntimeTelemetryResponse {}

message CommandStreamKeepAlive {}

message CommandStreamRequest {
    string runner_id = 1;
    string version = 2;
    string instance_id = 3;
    uint32 protocol_version = 4;
    // The highest runtime_order of any StartRuntimeCommand this process read from an earlier
    // command stream and admitted, or refused as older work (a refusal that counts toward
    // RuntimeStatus.settled_runtime_order, whether or not it raises it); 0 for none. A refused
    // Start that cannot be ordered, or that names the newest Start's runtime at another order, is
    // not counted. Every Start read from an earlier stream was admitted or refused before this
    // stream opened, but an admitted one may still be starting: this is no evidence that a
    // heartbeat accounts for it, which settled_runtime_order alone says. A Start the control plane
    // wrote to an earlier stream with a higher order never arrived, or was refused without
    // counting: it holds no report back.
    uint64 received_runtime_order = 5;
    // Rises by one with each command stream this process opens, starting at 1. The control plane
    // ignores an open whose sequence is not above the newest it has seen from this process, and
    // ends that stream.
    uint64 command_stream_sequence = 6;
}

message CommandStreamResponse {
    reserved 7, 8;
    reserved "quiesce_editor_runtime", "launch_editor_runtime";

    oneof payload {
        StartRuntimeCommand start_runtime = 1;
        StopSessionCommand stop_session = 2;
        SubmitPromptCommand submit_prompt = 3;
        CommandStreamKeepAlive keepalive = 4;
        SetGpuPowerLimitCommand set_gpu_power_limit = 5;
        RelayEditorRuntimeRequestCommand relay_editor_runtime_request = 6;
    }
}

message AcknowledgeRuntimeStartResponse {}
message AcknowledgeSessionStopResponse {}
message AcknowledgePromptResultResponse {}
message AcknowledgeGpuPowerLimitResponse {}
message AcknowledgeEditorRuntimeRequestResponse {}

message RunnerArtifactServiceListArtifactsRequest {
    string editor_sid = 1;
    string type = 2;
    string subfolder = 3;
    RunnerReadRequester requester = 4;
}

message RunnerArtifactServiceListArtifactsResponse {
    repeated offloadr.editor_runtime.v1.EditorArtifactMetadata artifacts = 1;
    // Artifacts deleted since the requester's session began, each as it was stored (its name and
    // created_utc): the user removed it from their files, or a temporary one expired. The runner
    // removes its unchanged local copy of each, so a deleted output is neither reported as
    // unsaved nor uploaded again. One replaced by another upload is not among them.
    repeated offloadr.editor_runtime.v1.EditorArtifactMetadata deleted_artifacts = 2;
}

message RunnerReadStreamMetadata {
    google.protobuf.StringValue content_type = 1;
    google.protobuf.Int64Value size_bytes = 2; // Bytes on the wire: the ciphertext size when sealed.
    google.protobuf.StringValue sha256 = 3;    // Of the bytes on the wire.
    google.protobuf.Timestamp modified_utc = 4;
    SealedEnvelope envelope = 5; // Set when the chunks carry a payload sealed to the request's reader_key.
}

// Who reads, and for which session runtime. The control plane authorizes a read against exactly
// this identity and the runner's current assignment (a runtime that is starting or relaunching
// reads before it is ready) and refuses one for a retired process or runtime. A sealed response's
// envelope identity takes session_id from here.
message RunnerReadRequester {
    reserved 4, 5, 6;
    reserved "lifecycle_generation", "runtime_epoch", "runtime_instance_id";

    string runner_id = 1;
    string instance_id = 2;           // The registered runner process (RegisterRunnerRequest.instance_id).
    string session_id = 3;
    RuntimeRef runtime = 7; // The session runtime the read is for; unset when unknown.
}

message RunnerArtifactServiceReadArtifactRequest {
    string editor_sid = 1;
    string filename = 2;
    string type = 3;
    string subfolder = 4;
    // The session's reader key. An encryption destination only: the read is authorized exactly
    // as without it, and the response is then sealed to it.
    SealingPublicKey reader_key = 5;
    RunnerReadRequester requester = 6;
}

message RunnerArtifactServiceReadArtifactResponse {
    oneof payload {
        RunnerReadStreamMetadata metadata = 1;
        bytes chunk = 2;
    }
}

message RunnerArtifactUploadMetadata {
    reserved 11, 12, 13;
    reserved "lifecycle_generation", "runtime_epoch", "runtime_instance_id";

    string editor_sid = 1;
    google.protobuf.StringValue prompt_id = 2;
    string filename = 3;
    string type = 4;
    string subfolder = 5;
    google.protobuf.StringValue content_type = 6;
    google.protobuf.Int64Value size_bytes = 7;
    google.protobuf.StringValue sha256 = 8;
    google.protobuf.StringValue owner = 9;
    google.protobuf.StringValue session_id = 10;
    string runner_id = 14;
    // Set when the chunks carry a payload sealed to the session's output recipient. size_bytes is
    // then the plaintext size the header declares, and sha256 is not sent: a plaintext digest
    // would reveal when two uploads carry equal content.
    SealedEnvelope envelope = 15;
    string instance_id = 16; // Captured registered process; never read from mutable session state.
    // Server-issued ID bound to one producer file snapshot across retries and rescans.
    // A changed file/target obtains a new ID. Not a plaintext digest or authorization.
    string upload_id = 17;
    RuntimeRef runtime = 18;
}

message RunnerArtifactServiceUploadArtifactRequest {
    oneof payload {
        RunnerArtifactUploadMetadata metadata = 1;
        bytes chunk = 2;
    }
}

enum RunnerArtifactUploadOutcome {
    RUNNER_ARTIFACT_UPLOAD_OUTCOME_UNSPECIFIED = 0;
    RUNNER_ARTIFACT_UPLOAD_OUTCOME_COMMITTED = 1;
    RUNNER_ARTIFACT_UPLOAD_OUTCOME_REJECTED_STALE_RUNTIME = 2;
    RUNNER_ARTIFACT_UPLOAD_OUTCOME_REJECTED_RETIRED_UPLOAD = 3;
}

message RunnerArtifactServiceUploadArtifactResponse {
    RunnerArtifactUploadOutcome outcome = 1;
    string message = 2;
    offloadr.editor_runtime.v1.EditorArtifactMetadata artifact = 3;
    string upload_id = 4; // Echo of the committed logical upload, never a new publication ID.
}

// Issuance has no artifact effect. A lost response may safely waste a number.
message RunnerArtifactServiceIssueUploadIdentityRequest {
    string editor_sid = 1;
    RunnerReadRequester requester = 2;
}

message RunnerArtifactServiceIssueUploadIdentityResponse {
    string upload_id = 1;
}

message RunnerWorkspaceServiceReadWorkspaceFileRequest {
    string editor_sid = 1;
    WorkspaceRoot root = 2;
    string relative_path = 3;
    SealingPublicKey reader_key = 4; // As on RunnerArtifactServiceReadArtifactRequest.
    RunnerReadRequester requester = 5;
}

message RunnerWorkspaceServiceReadWorkspaceFileResponse {
    oneof payload {
        RunnerReadStreamMetadata metadata = 1;
        bytes chunk = 2;
    }
}

message RunnerWorkspaceServiceReadWorkspaceSeedArchiveRequest {
    string editor_sid = 1;
    WorkspaceRoot root = 2;
    SealingPublicKey reader_key = 3; // As on RunnerArtifactServiceReadArtifactRequest.
    RunnerReadRequester requester = 4;
}

message RunnerWorkspaceServiceReadWorkspaceSeedArchiveResponse {
    oneof payload {
        RunnerReadStreamMetadata metadata = 1;
        bytes chunk = 2;
    }
}

message GetRunnerLaunchPlanRequest {
    string supervisor_version = 1; // Version of the supervisor asking, for diagnostics.
}

// One editor template and the runner image that serves it.
message RunnerLaunchTemplate {
    string editor_template = 1;     // Canonical template id, as advertised in RegisterRunnerRequest.supported_editor_templates.
    string editor_runtime_kind = 2; // comfyui | forge-neo
    string runner_image = 3;        // Image reference to run; digest-pinned when the server can resolve it.
    string label = 4;               // Human-readable name, e.g. "ComfyUI - current release".
}

message GetRunnerLaunchPlanResponse {
    repeated RunnerLaunchTemplate templates = 1;
    string selected_editor_template = 2; // The owner's current editor template; empty when unknown.
    int32 refresh_seconds = 3;           // When to ask again; 0 = supervisor default.
}

// Opened by a registered launcher, after its first accepted registration. Fenced on the launcher's
// registered instance_id.
message LauncherStreamRequest {
    string runner_id = 1;
    string version = 2;
    string instance_id = 3;
    uint32 protocol_version = 4;
}

// Sent at least every 15 seconds while nothing else is. A launcher that has received nothing on its
// stream for 45 seconds treats it as broken and reconnects.
message LauncherStreamKeepAlive {}

message LauncherStreamResponse {
    oneof payload {
        LauncherState state = 1;
        LauncherStreamKeepAlive keepalive = 2;
    }
}

// The launch the launcher should be working on. Sent first on every stream and again whenever it
// changes, so it is authoritative: a launch in flight that the latest state does not name is
// withdrawn (SUPERSEDED when another launch replaced it, CANCELLED when none did). The launcher
// starts a container only while its stream is live (a message within the last 45 seconds) and the
// state that stream sent last still names the launch; after a reconnect, only once the new stream's
// first state has arrived. A launch an executor has already matched stays named until the launcher
// it was issued to reports a terminal phase for it, so a launch that succeeded is never seen as
// withdrawn; it is named only to that launcher instance, never to one that took over.
message LauncherState {
    LaunchRunnerCommand current_launch = 1; // Unset: no launch is wanted.
}

// Start a runner container for an editor, because an allocation is waiting for one. The runner has
// at most one current launch; it belongs to that allocation and is withdrawn with it. It also belongs
// to the launcher instance it was issued to: when another launcher instance registers for the runner
// while no executor has matched the launch yet, the control plane retires it and issues the waiting
// allocation a new one (new launch_id, higher launch_sequence), so a container the old instance still
// starts never completes it. A matched launch is kept: its executor serves the allocation as usual.
message LaunchRunnerCommand {
    string launch_id = 1;        // UUID; the same in every state that names it. Passed into the container, which echoes it.
    uint64 launch_sequence = 2;  // Increases per runner; a launch replaces only one with a lower sequence.
    string editor_template = 3;  // As RunnerLaunchTemplate.editor_template.
    string runner_image = 4;     // As RunnerLaunchTemplate.runner_image.
    // The launcher's RegisterRunnerRequest.offer_revision that the allocation was checked against, read
    // together with the resources it checked. A launch whose revision is not the launcher's current one
    // was chosen for hardware this computer no longer offers: the launcher's registration with the new
    // revision retires it, and the launcher reports FAILED for it only after that registration was accepted.
    uint64 offer_revision = 5;
}

enum RunnerLaunchPhase {
    RUNNER_LAUNCH_PHASE_UNSPECIFIED = 0;
    RUNNER_LAUNCH_PHASE_PREPARING = 1;   // Checking the engine and the image, stopping a container left from another launch.
    RUNNER_LAUNCH_PHASE_DOWNLOADING = 2; // Downloading the image; the byte counts say how far.
    RUNNER_LAUNCH_PHASE_STARTING = 3;    // Starting the container.
    RUNNER_LAUNCH_PHASE_STARTED = 4;     // Terminal: the container was started. Not yet "an executor is ready".
    RUNNER_LAUNCH_PHASE_FAILED = 5;      // Terminal: message says why. Retires the launch unless an executor matched it.
    RUNNER_LAUNCH_PHASE_SUPERSEDED = 6;  // Terminal: a state named a launch with a higher sequence before this one started.
    RUNNER_LAUNCH_PHASE_CANCELLED = 7;   // Terminal: a state named no launch before this one started.
}

// Progress and outcome of a launch. A launcher reports at least every 30 seconds while a launch is in
// flight. A terminal phase is the acknowledgement: it is resent with the same content until accepted,
// and a repeat is accepted. Host shutdown never reports STARTED.
message ReportRunnerLaunchRequest {
    string runner_id = 1;
    string instance_id = 2;               // The launcher's registered instance.
    string launch_id = 3;
    RunnerLaunchPhase phase = 4;
    string message = 5;                   // Why it failed; at most 512 bytes. Empty otherwise.
    uint64 download_completed_bytes = 6;  // DOWNLOADING only.
    uint64 download_total_bytes = 7;      // DOWNLOADING only; 0 while unknown.
}

message ReportRunnerLaunchResponse {}

// Asked by a launcher before it stops a container it started. Names the container by the launch it
// was started for (always set: an agent restarted inside the container keeps it, while its
// instance changes) and, when the launcher could read it, by its executor instance. Checked
// atomically, under the lock allocation takes:
// - Each identity that is set is looked up among registered executors. If they find different
//   executors, or the instance finds an executor registered with another launch_id, the release is
//   refused.
// - If either finds a registered executor, the release is granted only while it is the current
//   executor instance with no open session and no pending Start or Stop.
// - If neither does (its agent failed to start, or wrote its status file but has not registered
//   yet), the release is granted.
// - A granted release makes the executor it found unavailable in the same transaction, before the
//   answer is sent, so nothing is assigned to it while the launcher stops it.
// - A granted release fences every identity it names, launch_id and executor_instance_id, for good:
//   a registration carrying a fenced one is refused, whenever it arrives. A replacement
//   container always has new identities, so it is unaffected. Repeating a granted release is granted again.
// - With container_exited, the executor is not checked for being idle: the session it held is ended,
//   its pending Stop completed and its pending Start cancelled, it is unregistered and both identities
//   are fenced. A launch it names that no executor has matched is retired in the same transaction. The rules above on a missing launch_id, an instance registered under another
//   launch_id and repeats apply unchanged.
message ReleaseRunnerRequest {
    string runner_id = 1;
    // The launcher instance asking. Recorded; a release is decided on the executor's state, not on
    // whether this launcher is still current.
    string instance_id = 2;
    string executor_instance_id = 3;  // The executor's registered instance, from its status file; empty if it never wrote one.
    string launch_id = 4;             // The launch the container was started for. Required: a release without one is refused.
    // The container this release names is not running and will not be started again: it exited,
    // was killed, or the launcher stopped it without a granted release. The control plane then ends
    // the session that executor held and fences it, instead of checking that it is idle.
    bool container_exited = 5;
}

message ReleaseRunnerResponse {
    bool released = 1;  // False: something is assigned to it, so keep it running.
    string message = 2;
}

// Offloadr API service exposed to runner agents.
service RunnerControlService {
    rpc RegisterRunner(RegisterRunnerRequest) returns (RegisterRunnerResponse);
    rpc CommandStream(CommandStreamRequest) returns (stream CommandStreamResponse);
    rpc AcknowledgeRuntimeStart(AcknowledgeRuntimeStartRequest) returns (AcknowledgeRuntimeStartResponse);
    rpc AcknowledgeSessionStop(AcknowledgeSessionStopRequest) returns (AcknowledgeSessionStopResponse);
    rpc AcknowledgePromptResult(AcknowledgePromptResultRequest) returns (AcknowledgePromptResultResponse);
    rpc GrantPromptExecution(GrantPromptExecutionRequest) returns (GrantPromptExecutionResponse);
    rpc AcknowledgeGpuPowerLimit(AcknowledgeGpuPowerLimitRequest) returns (AcknowledgeGpuPowerLimitResponse);
    rpc GrantGpuPowerExecution(GrantGpuPowerExecutionRequest) returns (GrantGpuPowerExecutionResponse);
    rpc AcknowledgeEditorRuntimeRequest(AcknowledgeEditorRuntimeRequestRequest) returns (AcknowledgeEditorRuntimeRequestResponse);
    rpc ReportModelDownload(ReportModelDownloadRequest) returns (ReportModelDownloadResponse);
    rpc SyncLocalModels(SyncLocalModelsRequest) returns (SyncLocalModelsResponse);
    rpc ReportRuntimeActivity(ReportRuntimeActivityRequest) returns (ReportRuntimeActivityResponse);
    rpc ReportSessionEvents(ReportSessionEventsRequest) returns (ReportSessionEventsResponse);
    rpc ReportSessionLogs(ReportSessionLogsRequest) returns (ReportSessionLogsResponse);
    rpc ReportRunnerLogs(ReportRunnerLogsRequest) returns (ReportRunnerLogsResponse);
    rpc ReportRuntimeTelemetry(ReportRuntimeTelemetryRequest) returns (ReportRuntimeTelemetryResponse);
    // Which runner image a local supervisor (for example the desktop app) should run for the key's
    // owner. A catalog query only: it must not count as a heartbeat or change runner liveness,
    // instance identity or registration state.
    rpc GetRunnerLaunchPlan(GetRunnerLaunchPlanRequest) returns (GetRunnerLaunchPlanResponse);
    // Launcher lane: launch requests, their progress, and releasing an idle executor before stopping it.
    rpc LauncherStream(LauncherStreamRequest) returns (stream LauncherStreamResponse);
    rpc ReportRunnerLaunch(ReportRunnerLaunchRequest) returns (ReportRunnerLaunchResponse);
    rpc ReleaseRunner(ReleaseRunnerRequest) returns (ReleaseRunnerResponse);
}

// Runner-scoped artifact APIs authenticated via runner secret.
service RunnerArtifactService {
    rpc IssueUploadIdentity(RunnerArtifactServiceIssueUploadIdentityRequest) returns (RunnerArtifactServiceIssueUploadIdentityResponse);
    rpc ListArtifacts(RunnerArtifactServiceListArtifactsRequest) returns (RunnerArtifactServiceListArtifactsResponse);
    rpc ReadArtifact(RunnerArtifactServiceReadArtifactRequest) returns (stream RunnerArtifactServiceReadArtifactResponse);
    rpc UploadArtifact(stream RunnerArtifactServiceUploadArtifactRequest) returns (RunnerArtifactServiceUploadArtifactResponse);
}

service RunnerWorkspaceService {
    rpc ReadWorkspaceFile(RunnerWorkspaceServiceReadWorkspaceFileRequest) returns (stream RunnerWorkspaceServiceReadWorkspaceFileResponse);
    rpc ReadWorkspaceSeedArchive(RunnerWorkspaceServiceReadWorkspaceSeedArchiveRequest) returns (stream RunnerWorkspaceServiceReadWorkspaceSeedArchiveResponse);
}
