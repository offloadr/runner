syntax = "proto3";

package offloadr.runner.v1;

import "offloadr/common/v1/gpus.proto"; // GpuType
import "offloadr/common/v1/models.proto"; // ModelCategory
import "offloadr/common/v1/prompt.proto"; // Prompt relay helpers
import "offloadr/common/v1/gpu_control.proto";
import "offloadr/runner/v1/allocator.proto"; // RunnerRuntimeTelemetrySnapshot
import "offloadr/editor_runtime/v1/editor_proxy.proto"; // Artifact messages
import "google/protobuf/timestamp.proto"; // Timestamp for session stream events
import "google/protobuf/wrappers.proto";

// Basic hardware/resource snapshot sent during registration.
message RunnerResources {
	offloadr.common.v1.GpuType gpu_type = 1;       // Optional coarse classification for hosted matching/metrics.
	uint64 gpu_count = 2;       // Number of GPUs visible/usable.
	uint64 vram_bytes = 3;      // Total VRAM across all GPUs (or primary) in bytes.
	uint64 system_ram_bytes = 4;// Total system RAM in bytes.
    string gpu_model_name = 5;  // Free-form GPU model (e.g., "NVIDIA GeForce RTX 4090").
}

// Sealed sessions keep user data in memory-backed storage on the runner and seal artifact
// transfers with the envelope format in docs/sealed-envelope.md.
enum SealedStorageMode {
    SEALED_STORAGE_MODE_UNSPECIFIED = 0;
    SEALED_STORAGE_MODE_OFF = 1;      // Never seals; refuses starts that require it.
    SEALED_STORAGE_MODE_AUTO = 2;     // Seals sessions whose start requires it.
    SEALED_STORAGE_MODE_REQUIRED = 3; // Seals every session's workspace.
}

// What a runner can offer sealed sessions, reported with every registration.
message RunnerSealedStorage {
    SealedStorageMode mode = 1;
    bool memory_workspace_available = 2; // The memory-backed root can take a session now.
    uint64 budget_bytes = 3;             // Smaller of the root's free space and the container's memory headroom.
    repeated string algorithms = 4;      // Sealing algorithm ids the runner accepts.
}

// A public key that envelopes are sealed to.
message SealingPublicKey {
    string key_id = 1;    // Chosen by the key's owner; 1 to 128 UTF-8 bytes.
    string algorithm = 2; // "hpke-p256-sha256-aes128gcm+stream-aes256gcm-64k-v1"
    bytes public_key = 3; // 65-byte uncompressed SEC1 P-256 point.
}

// Key material sent ahead of a sealed payload. The stream's chunk messages then carry the
// payload ciphertext, which they may split anywhere.
message SealedEnvelope {
    bytes header = 1;           // Canonical header; names the recipient key and the object.
    bytes encapsulated_key = 2; // HPKE enc (65 bytes).
    bytes sealed_data_key = 3;  // HPKE-sealed data key (48 bytes).
}

// How a session's data is protected.
message SessionSealing {
    // The sealed-session profile: a memory-backed workspace, every upload sealed to
    // output_recipient and every read answered sealed to the runner's reader key. A runner that
    // cannot provide all of it refuses the start; inside the profile it never falls back to
    // plaintext transfers.
    bool required = 1;
    // Recipient for uploads. When set outside the profile, uploads are still sealed to it.
    SealingPublicKey output_recipient = 2;
}

// What the runner applied to a started session.
message SessionSealingStatus {
    bool memory_workspace = 1;         // The session's user data lives in memory-backed storage.
    bool encrypted_uploads = 2;        // Every upload is sealed to the output recipient.
    bool encrypted_reads_required = 3; // A read answered without an envelope fails.
}

// Command from Offloadr API instructing a runner to start a session for a user.
message StartSessionCommand {
    reserved 12;

    string session_id = 1;     // Session id (uuid, no dashes)
    string user = 2;           // Username/owner for the session
    string editor_sid = 3;
    repeated ModelDownloadRequest initial_models = 4;
    repeated offloadr.editor_runtime.v1.EditorArtifactMetadata initial_artifacts = 5;
    repeated WorkspaceFileMetadata initial_workspace_files = 6;
    string editor_template = 7;
    string editor_runtime_kind = 8;
    uint64 lifecycle_generation = 9;
    uint64 runtime_epoch = 10;
    string runtime_instance_id = 11;
    // Optional. Increases each time the control plane assigns a session to this runner,
    // across sessions. When set, the runner refuses a start older than the newest
    // assignment it has seen, so a delayed start cannot replace a newer session.
    uint64 assignment_sequence = 13;
    // Optional. Absent means an unsealed session, unless the runner seals every session.
    SessionSealing sealing = 14;
}

// Command instructing runner to stop a session (graceful cleanup + release).
message StopSessionCommand {
	string session_id = 1;
	string user = 2;
	string command_id = 3;
	// Runtime identity of the Stop. When lifecycle_generation is set the
	// runner ignores a Stop that is older than the session's current runtime;
	// unset fields leave the Stop unfenced.
	uint64 lifecycle_generation = 4;
	uint64 runtime_epoch = 5;
	string runtime_instance_id = 6;
}

message QuiesceEditorRuntimeCommand {
    string command_id = 1;
    string restart_id = 2;
    string runner_id = 3;
    string session_id = 4;
    string editor_sid = 5;
    uint64 lifecycle_generation = 6;
    uint64 runtime_epoch = 7;
    string runtime_instance_id = 8;
    uint32 restart_revision = 9;
}

message LaunchEditorRuntimeCommand {
    reserved 17;

    string command_id = 1;
    string restart_id = 2;
    string runner_id = 3;
    string session_id = 4;
    string user = 5;
    string editor_sid = 6;
    string editor_template = 7;
    string editor_runtime_kind = 8;
    uint64 lifecycle_generation = 9;
    uint64 runtime_epoch = 10;
    string runtime_instance_id = 11;
    uint32 restart_revision = 12;
    uint32 attempt = 13;
    repeated ModelDownloadRequest initial_models = 14;
    repeated offloadr.editor_runtime.v1.EditorArtifactMetadata initial_artifacts = 15;
    repeated WorkspaceFileMetadata initial_workspace_files = 16;
    // The session's sealing, as on its StartSessionCommand. The runner also keeps the start's,
    // but a runner that restarted since has only this.
    SessionSealing sealing = 18;
}

message SubmitPromptCommand {
    string session_id = 1;
    string submission_id = 2;
    string editor_sid = 3;
    string prompt_json = 4;
    string owner = 5;
    repeated ModelDownloadRequest downloads = 6;
    string editor_runtime_kind = 7;
    string http_method = 8;
    string http_path = 9;
    string http_query = 10;
    string content_type = 11;
    repeated offloadr.common.v1.PromptHttpRequest preflight_requests = 12;
    repeated offloadr.common.v1.PromptArtifactReference artifact_references = 13;
    bytes websocket_client_message = 14;
    offloadr.common.v1.PromptExecutionTarget target = 15;
    string command_id = 16;
    // A new recovery delivery still refers to this original immutable command.
    // It cannot acquire another execution permission or invoke native mutations.
    uint64 recovery_revision = 17;
    bool recovery_only = 18;
    offloadr.common.v1.PromptNativeIdentifiers native_identifiers = 19;
}

message RelayEditorRuntimeRequestCommand {
    string request_id = 1;
    string delivery_id = 2;
    string runner_id = 3;
    string session_id = 4;
    string editor_sid = 5;
    uint64 lifecycle_generation = 6;
    offloadr.editor_runtime.v1.EditorRuntimeRequestKind kind = 7;
    string method = 8;
    string path = 9;
    string query = 10;
    bytes body = 11;
    string content_type = 12;
    string client_id = 13;
    bytes client_message = 14;
    google.protobuf.Timestamp expires_utc = 15;
    uint32 attempt = 16;
    bool urgent = 17;
    uint64 runtime_epoch = 18;
    string runtime_instance_id = 19;
    string bridge_connection_id = 20;
    uint64 bridge_lease_revision = 21;
}

message AcknowledgeEditorRuntimeRequestRequest {
    string request_id = 1;
    string delivery_id = 2;
    string runner_id = 3;
    string session_id = 4;
    uint64 lifecycle_generation = 5;
    bool transport_succeeded = 6;
    int32 status_code = 7;
    bytes body = 8;
    string content_type = 9;
    string error_message = 10;
    offloadr.editor_runtime.v1.EditorRuntimeRequestKind kind = 11;
    uint64 runtime_epoch = 12;
    string runtime_instance_id = 13;
}

enum EditorRuntimeBridgeState {
    EDITOR_RUNTIME_BRIDGE_STATE_UNSPECIFIED = 0;
    EDITOR_RUNTIME_BRIDGE_STATE_ACTIVE = 1;
    EDITOR_RUNTIME_BRIDGE_STATE_HEARTBEAT = 2;
    EDITOR_RUNTIME_BRIDGE_STATE_INACTIVE = 3;
}

