}

// A required fact that a managed runtime produced native activity. It carries no
// log, prompt, result, exception text or producer timestamp. Physical readiness
// and optional diagnostic delivery remain independent.
message ReportRuntimeActivityRequest {
    string runner_id = 1;
    string session_id = 2;
    string instance_id = 3;
    uint64 lifecycle_generation = 4;
    uint64 runtime_epoch = 5;
    string runtime_instance_id = 6;
    SessionSealingStatus sealing = 7;
}

enum RuntimeActivityOutcome {
    RUNTIME_ACTIVITY_OUTCOME_UNSPECIFIED = 0;
    RUNTIME_ACTIVITY_OUTCOME_APPLIED = 1;
    RUNTIME_ACTIVITY_OUTCOME_ALREADY_APPLIED_EXACTLY = 2;
    RUNTIME_ACTIVITY_OUTCOME_OBSOLETE_OR_PREEMPTED = 3;
    RUNTIME_ACTIVITY_OUTCOME_INVALID_IDENTITY = 4;
    RUNTIME_ACTIVITY_OUTCOME_CONFLICTING_STATE = 5;
    RUNTIME_ACTIVITY_OUTCOME_NOT_READY = 6;
}

message ReportRuntimeActivityResponse {
    RuntimeActivityOutcome outcome = 1;
    google.protobuf.Timestamp runtime_started_utc = 2;
}

message ReportSessionEventsRequest {
